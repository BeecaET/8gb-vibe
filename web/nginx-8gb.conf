# nginx for 8gb.beeca.vn: static site + DMG files.
# Install it on the web server as the vhost for 8gb.beeca.vn.
# This file is the source of truth: edit it here first, then copy it to the server.
# The BT panel includes vhost files inside the http {} block, so the map block can sit at the top.
# Certificates come from certbot (webroot), not from the panel's SSL page.
# nginx 1.24 has no "http2 on;" directive, so use "listen 443 ssl http2".
# Do not put add_header inside a location: nginx would then drop every add_header of the server block.
# Log: /www/wwwlogs/8gb.beeca.vn.log

map $uri $vibe8gb_cache {
    default            "public, max-age=86400";
    "/"                "no-cache";
    ~\.html$           "no-cache";
    # CSS, JS: the browser revalidates every time (ETag), so no stale copy after a deploy.
    ~\.(css|js)$       "no-cache";
    ~^/tai-ve/         "public, max-age=604800";
}

server {
    listen 80;
    server_name 8gb.beeca.vn;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/8gb.beeca.vn; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name 8gb.beeca.vn;

    ssl_certificate     /etc/letsencrypt/live/8gb.beeca.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8gb.beeca.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/8gb.beeca.vn;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain application/xml;

    access_log /www/wwwlogs/8gb.beeca.vn.log;

    add_header Cache-Control $vibe8gb_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Downloads: 8GB-Vibe-<version>.dmg and .sha256
    location ^~ /tai-ve/ {
        types { application/x-apple-diskimage dmg; text/plain sha256; }
        default_type application/octet-stream;
        autoindex off;
    }

    # Block non-site files in case they were copied up by mistake
    location ~ \.(sh|md|conf)$ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
