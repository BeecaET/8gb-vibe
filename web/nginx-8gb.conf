# nginx cho 8gb.beeca.vn - trang tĩnh + tệp DMG.
# Đặt trên máy chủ web làm vhost cho 8gb.beeca.vn.
# Tệp này là bản gốc trong repo; sửa ở đây trước, rồi mới chép lên máy chủ.
# Tệp vhost của panel BT được include trong khối http {}, nên khối map đặt ở đầu tệp được.
# Chứng chỉ do certbot cấp (webroot), không dùng mục SSL của panel.
# nginx 1.24 chưa có chỉ thị "http2 on;", nên dùng "listen 443 ssl http2".
# Lưu ý: không đặt add_header trong các location, vì nginx sẽ bỏ toàn bộ add_header của server.
# Log: /www/wwwlogs/8gb.beeca.vn.log

map $uri $vibe8gb_cache {
    default            "public, max-age=86400";
    "/"                "no-cache";
    ~\.html$           "no-cache";
    # CSS, JS: trình duyệt hỏi lại máy chủ mỗi lần (ETag), tránh dùng bản cũ sau khi deploy.
    ~\.(css|js)$       "no-cache";
    ~^/tai-ve/         "public, max-age=604800";
}

server {
    listen 80;
    server_name 8gb.beeca.vn;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/8gb.beeca.vn; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name 8gb.beeca.vn;

    ssl_certificate     /etc/letsencrypt/live/8gb.beeca.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8gb.beeca.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/8gb.beeca.vn;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain application/xml;

    access_log /www/wwwlogs/8gb.beeca.vn.log;

    add_header Cache-Control $vibe8gb_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Tệp tải về: 8GB-Vibe-<phiên bản>.dmg và .sha256
    location ^~ /tai-ve/ {
        types { application/x-apple-diskimage dmg; text/plain sha256; }
        default_type application/octet-stream;
        autoindex off;
    }

    # Chặn tệp không phải trang web nếu lỡ chép lên
    location ~ \.(sh|md|conf)$ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
