name: Feature request
description: Suggest an idea for 8GB Vibe.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What slows you down today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: input
    id: mac
    attributes:
      label: Mac model and RAM
      placeholder: MacBook Air M2, 8 GB
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The idea keeps the rule "always ask first, never quit or delete on its own".
          required: true
