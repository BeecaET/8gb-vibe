name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems: please do not file them here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: 8GB Vibe version
      description: From the About page, for example 1.1.0 (build 120).
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Air M2 (2022)
    validations:
      required: true
  - type: dropdown
    id: ram
    attributes:
      label: RAM
      options:
        - 8 GB
        - 16 GB
        - 18 GB or 24 GB
        - 32 GB or more
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: What was running?
      description: For example 3 Claude Code sessions, Xcode, a Next.js dev server.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or log
      description: Optional. The log is at ~/Library/Application Support/8GB Vibe/nhat-ky.jsonl. Remove anything private first.
